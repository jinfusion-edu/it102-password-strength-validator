<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Week 4 Assignment: Password Validator</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 2rem; background: #f4f4f9; display: flex; justify-content: center; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; margin-bottom: 0.25rem; font-weight: 500; }
        input { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 1rem; }

        .strength-container { margin: 0.5rem 0 1rem 0; }
        .strength-text { font-weight: bold; }
        .strength-bar { height: 6px; width: 100%; background: #e9ecef; border-radius: 3px; margin-top: 0.25rem; position: relative; }
        .strength-fill { height: 100%; width: 0%; border-radius: 3px; transition: width 0.3s, background-color 0.3s; }

        .checklist { list-style: none; padding: 0; margin: 0.5rem 0; font-size: 0.9rem; }
        .checklist li { margin-bottom: 0.25rem; color: #dc3545; }
        .checklist li.valid { color: #28a745; }

        .match-feedback { font-weight: 600; font-size: 0.95rem; margin-top: 0.5rem; }
        .text-danger { color: #dc3545; }
        .text-success { color: #28a745; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Create Account</h2>

        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" placeholder="Enter password">

            <div class="strength-container">
                <span>Strength: <span id="strengthText" class="strength-text">Empty</span></span>
                <div class="strength-bar"><div id="strengthFill" class="strength-fill"></div></div>
            </div>

            <ul class="checklist">
                <li id="ruleLength">&#10007; At least 8 characters</li>
                <li id="ruleNumber">&#10007; Contains a number (0-9)</li>
                <li id="ruleSpecial">&#10007; Contains a special character (!@#$%^&amp;*)</li>
            </ul>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password:</label>
            <input type="password" id="confirmPassword" placeholder="Re-enter password">
            <div id="matchResult" class="match-feedback"></div>
        </div>
    </div>

    <script>
        /* ================================================================
           STEP 1 — the AI-generated rule checker.

           No Regular Expressions anywhere, per the assignment. Digits are
           found by comparing characters, and specials by indexOf against a
           plain string of allowed characters.
           ================================================================ */
        function checkPasswordRules(passwordString) {
            var text = passwordString;

            if (text === undefined || text === null) {
                text = "";
            }

            // Rule 1: 8 or more characters.
            var hasMinLength = text.length >= 8;

            // Rule 2: contains at least one digit '0'-'9'.
            // Characters compare by their code, so '5' >= '0' && '5' <= '9'.
            var hasNumber = false;
            for (var i = 0; i < text.length; i++) {
                var character = text.charAt(i);
                if (character >= "0" && character <= "9") {
                    hasNumber = true;
                }
            }

            // Rule 3: contains at least one of these special characters.
            var SPECIAL_CHARACTERS = "!@#$%^&*";
            var hasSpecial = false;
            for (var j = 0; j < text.length; j++) {
                if (SPECIAL_CHARACTERS.indexOf(text.charAt(j)) !== -1) {
                    hasSpecial = true;
                }
            }

            return {
                hasMinLength: hasMinLength,
                hasNumber: hasNumber,
                hasSpecial: hasSpecial
            };
        }

        /* ================================================================
           STEP 2 — implement and connect.
           ================================================================ */

        var passwordInput = document.getElementById("password");
        var confirmInput = document.getElementById("confirmPassword");
        var strengthText = document.getElementById("strengthText");
        var strengthFill = document.getElementById("strengthFill");
        var matchResult = document.getElementById("matchResult");

        // The rule labels are stored as constants and the line is REBUILT
        // from them each time. Slicing the existing text to swap the mark
        // would eat a character more on every keystroke.
        var RULE_LABELS = {
            ruleLength: "At least 8 characters",
            ruleNumber: "Contains a number (0-9)",
            ruleSpecial: "Contains a special character (!@#$%^&*)"
        };

        var CHECK_MARK = "✓"; // ✓
        var CROSS_MARK = "✗"; // ✗

        function paintRule(elementId, hasPassed) {
            var listItem = document.getElementById(elementId);

            if (hasPassed) {
                listItem.textContent = CHECK_MARK + " " + RULE_LABELS[elementId];
                listItem.classList.add("valid");
            } else {
                listItem.textContent = CROSS_MARK + " " + RULE_LABELS[elementId];
                listItem.classList.remove("valid");
            }
        }

        function updateUI() {
            var password = passwordInput.value;
            var confirmation = confirmInput.value;

            var rules = checkPasswordRules(password);

            // --- 1. Rule visuals -------------------------------------
            paintRule("ruleLength", rules.hasMinLength);
            paintRule("ruleNumber", rules.hasNumber);
            paintRule("ruleSpecial", rules.hasSpecial);

            // --- 2. Overall strength ---------------------------------
            var rulesPassed = 0;
            if (rules.hasMinLength) { rulesPassed = rulesPassed + 1; }
            if (rules.hasNumber) { rulesPassed = rulesPassed + 1; }
            if (rules.hasSpecial) { rulesPassed = rulesPassed + 1; }

            // The empty field is checked FIRST. Without this it would score
            // zero rules and render as "Weak" at 33%, not "Empty" at 0%.
            if (password.length === 0) {
                strengthText.textContent = "Empty";
                strengthFill.style.width = "0%";
            } else if (rulesPassed <= 1) {
                strengthText.textContent = "Weak";
                strengthFill.style.backgroundColor = "#dc3545";
                strengthFill.style.width = "33%";
            } else if (rulesPassed === 2) {
                strengthText.textContent = "Medium";
                strengthFill.style.backgroundColor = "#ffc107";
                strengthFill.style.width = "66%";
            } else {
                strengthText.textContent = "Strong";
                strengthFill.style.backgroundColor = "#28a745";
                strengthFill.style.width = "100%";
            }

            // --- 3. Confirmation match -------------------------------
            // The success message is gated on the 8-character minimum, not
            // merely on both fields being non-empty. That is what makes the
            // assignment's own Test 1 (P@ss / P@ss) behave as specified.
            // See AUDIT-NOTES.md — the written rule and the test table
            // disagree, and this reading is the only one that passes all
            // four supplied rows.
            if (password.length === 0 || confirmation.length === 0) {
                matchResult.textContent = "";
                matchResult.classList.remove("text-success");
                matchResult.classList.remove("text-danger");
            } else if (password === confirmation) {
                if (rules.hasMinLength) {
                    matchResult.textContent = "Passwords match!";
                    matchResult.classList.add("text-success");
                    matchResult.classList.remove("text-danger");
                } else {
                    // Identical, but too short to confirm. Stay silent rather
                    // than claim success or falsely claim a mismatch; the red
                    // length rule above already tells the user what is wrong.
                    matchResult.textContent = "";
                    matchResult.classList.remove("text-success");
                    matchResult.classList.remove("text-danger");
                }
            } else {
                matchResult.textContent = "Passwords do not match.";
                matchResult.classList.add("text-danger");
                matchResult.classList.remove("text-success");
            }
        }

        // Real-time validation: 'input' fires on every keystroke, unlike
        // 'change', which waits for the field to lose focus. Both fields
        // run the same update so neither display can go stale.
        passwordInput.addEventListener("input", updateUI);
        confirmInput.addEventListener("input", updateUI);
    </script>
</body>
</html>
